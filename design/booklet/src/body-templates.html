<!-- ========== 01 学术手稿 ========== -->
<template id="tpl-tufte">
<div class="sp sp-tufte">
  <h1>Taylor 多项式如何逼近正弦</h1>
  <p class="subtitle">第 4 章　幂级数</p>
  <section>
    <p><span class="newthought">把正弦的幂级数截断</span>到 $N$ 阶，就得到一个多项式 $T_N$。$N$ 越大，$T_N$ 贴合 $\sin x$ 的区间越长<button class="sn-ref" type="button" aria-label="旁注 1">1</button><span class="sidenote"><span class="sn-num">1</span>Euler 在 1748 年的《无穷小分析引论》中系统使用了这类展开。</span>；在任何有界区间上，误差都趋于零。</p>
    $$\sin x = \sum_{k \ge 0} \frac{(-1)^k\, x^{2k+1}}{(2k+1)!} = x - \frac{x^3}{3!} + \frac{x^5}{5!} - \cdots$$
    <figure>
      <figcaption class="marginnote">图 1　灰线是 $\sin x$，黑线是 $T_N$。当前 $N =$ <span class="n-out num">7</span>，在 $[-\pi, \pi]$ 上的最大误差为 <span class="err-out num">0.0752</span>。</figcaption>
      <svg class="plot" role="img" aria-label="正弦与 Taylor 多项式的图像"></svg>
      <div class="ctrl"><label for="n-tufte">阶数 $N$</label><input id="n-tufte" class="n-range" type="range" min="1" max="19" step="2" value="7"></div>
    </figure>
    <p><span class="sc">定理 4.17</span>（Taylor 展开的判据）　设 $f \in \mathcal{C}^\infty(\mathbb{R})$。若对每个 $A > 0$，存在 $M_A$，使 $|f^{(n)}(x)| \le M_A$ 对一切 $n$ 和 $|x| \le A$ 成立，则对一切 $x$，$f(x) = \sum_{n \ge 0} \frac{f^{(n)}(0)}{n!}\, x^n$。</p>
    <p><button class="proof-toggle" type="button" aria-expanded="false">证明</button><button class="sn-ref" type="button" aria-label="旁注 2">2</button><span class="sidenote"><span class="sn-num">2</span>Lagrange 余项：误差等于第 $N+1$ 阶导数在 $0$ 与 $x$ 之间某点的值，乘以 $x^{N+1}/(N+1)!$。</span></p>
    <div class="proof" hidden><p>取 $A = |x|$。由 Lagrange 余项，$|f(x) - T_N(x)| \le M_A \dfrac{|x|^{N+1}}{(N+1)!}$，右边随 $N \to \infty$ 趋于 $0$。<span class="qed">∎</span></p></div>
  </section>
</div>
</template>
